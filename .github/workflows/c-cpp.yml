name: C/C++ CI

on:
  push:
    branches: [ "cxl_based_tma" ]
  pull_request:
    branches: [ "cxl_based_tma" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip
        vcpkg/bootstrap-vcpkg.sh
        vcpkg/vcpkg install
    
    - name: Configure ChampSim
      run: ./config.sh champsim_config.json
    
    - name: Build ChampSim
      run: make
    
    - name: Run C++ tests
      run: make test
    
    - name: Run Python tests
      run: make pytest
