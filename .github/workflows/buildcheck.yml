name: Build Check

on:
  schedule:
    # run every sunday at 06:17 UTC
    - cron: "17 6 * * 0"
  push:
    branches: [ "cxl_based_tma" ]
  pull_request:
    branches: [ "cxl_based_tma" ]
  workflow_dispatch:

jobs:
  single_core:
    runs-on: ubuntu-latest

    steps:
    - name: Set up basic environment
      run: |
        sudo apt-get update
        sudo apt-get install -y curl zip unzip tar python3 python3-pip

    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Set up vcpkg
      run: |
        vcpkg/bootstrap-vcpkg.sh
        vcpkg/vcpkg install

    - name: Download Traces
      run: |
        curl -s --remote-name-all https://dpc3.compas.cs.stonybrook.edu/champsim-traces/speccpu/400.perlbench-41B.champsimtrace.xz

    - name: Configure ChampSim
      run: ./config.sh champsim_config.json

    - name: Build ChampSim
      run: make

    # TODO run an actual set of checks
    - name: Run tests
      run: ./bin/champsim --warmup-instructions 50000000 --simulation-instructions 50000000 --json=single_core_result.json -- 400.perlbench-41B.champsimtrace.xz

    # We upload the generated files under github actions assets
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: champsim-singlecore-results
        path: single_core_result.json

  multi_core:
    runs-on: ubuntu-latest

    steps:
    - name: Set up basic environment
      run: |
        sudo apt-get update
        sudo apt-get install -y curl zip unzip tar python3 python3-pip

    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Set up vcpkg
      run: |
        vcpkg/bootstrap-vcpkg.sh
        vcpkg/vcpkg install

    - name: Download Traces
      run: |
        curl -s --remote-name-all https://dpc3.compas.cs.stonybrook.edu/champsim-traces/speccpu/400.perlbench-41B.champsimtrace.xz https://dpc3.compas.cs.stonybrook.edu/champsim-traces/speccpu/401.bzip2-226B.champsimtrace.xz

    - name: Configure for multi-core
      run: |
        # Backup original config
        cp champsim_config.json champsim_config.json.backup
        # Change num_cores to 2
        sed -i 's/"num_cores": 1/"num_cores": 2/' champsim_config.json

    - name: Configure ChampSim
      run: ./config.sh champsim_config.json

    - name: Build ChampSim
      run: make

    # TODO run an actual set of checks
    - name: Run tests
      run: ./bin/champsim --warmup-instructions 50000000 --simulation-instructions 50000000 --json=multi_core_result.json -- 400.perlbench-41B.champsimtrace.xz 401.bzip2-226B.champsimtrace.xz

    - name: Restore original config
      run: |
        # Restore original config
        mv champsim_config.json.backup champsim_config.json

    # We upload the generated files under github actions assets
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: champsim-multicore-results
        path: multi_core_result.json
